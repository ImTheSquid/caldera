[project]
name = "caldera"
version = "0.1.0"
description = "Program an Every Day Calendar over serial"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["tests", "examples/haunted"]
